[package]
name = "spike-typst"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
mitex = "0.2.4"
typst = "0.15.1"
typst-pdf = "0.15.1"
typst-layout = "0.15.1"
typst-assets = { version = "0.15.1" }
wasm-bindgen = "0.2"

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
