# Caminho relativo: Cargo.toml

[workspace]
resolver = "3"
members = ["app/core", "app/wasm"]

[workspace.package]
edition = "2024"
rust-version = "1.97"
license = "MIT"
authors = ["Iago Leal"]

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
