# Caminho relativo: .github/workflows/ci.yml
#
# Verifica Rust, WASM e web em todo PR e na main; procura segredos; publica no GitHub Pages a
# partir da main. Actions fixadas por SHA (atualizadas pelo Dependabot).

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  segredos:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2
        with:
          # Versão fixa: "a mais recente" mudava sozinha e quebrou o carregamento do núcleo
          # (0.15.1). Subir de versão é decisão explícita, junto com o AGENTS.md.
          tool: wasm-pack@0.15.0

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Rust — formatação
        run: cargo fmt --all --check

      - name: Rust — lint
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Rust — testes
        run: cargo test --workspace

      - name: WASM — testes
        run: wasm-pack test --node app/wasm

      - name: WASM — build
        run: wasm-pack build app/wasm --target web --release

      - name: Web — dependências
        run: pnpm install --frozen-lockfile

      - name: Web — tipos
        run: pnpm -C app/web check

      - name: Web — lint
        run: pnpm -C app/web lint

      - name: Web — testes
        run: pnpm -C app/web test

      - name: Web — navegador para e2e
        run: pnpm -C app/web exec playwright install --with-deps chromium

      - name: Web — e2e
        run: pnpm -C app/web test:e2e

      - name: Web — build para o GitHub Pages
        run: pnpm -C app/web build
        env:
          BASE_PATH: /${{ github.event.repository.name }}

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        with:
          path: app/web/build

  deploy:
    needs: [segredos, verify]
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
