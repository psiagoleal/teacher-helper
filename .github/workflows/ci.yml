# Caminho relativo: .github/workflows/ci.yml
#
# Verifica Rust, WASM e web em todo push/PR; publica no GitHub Pages a partir da branch padrão.

name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Rust — formatação
        run: cargo fmt --all --check

      - name: Rust — lint
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Rust — testes
        run: cargo test --workspace

      - name: WASM — testes
        run: wasm-pack test --node app/wasm

      - name: WASM — build
        run: wasm-pack build app/wasm --target web --release

      - name: Web — dependências
        run: pnpm install --frozen-lockfile

      - name: Web — tipos
        run: pnpm -C app/web check

      - name: Web — lint
        run: pnpm -C app/web lint

      - name: Web — testes
        run: pnpm -C app/web test

      - name: Web — navegador para e2e
        run: pnpm -C app/web exec playwright install --with-deps chromium

      - name: Web — e2e
        run: pnpm -C app/web test:e2e

      - name: Web — build para o GitHub Pages
        run: pnpm -C app/web build
        env:
          BASE_PATH: /${{ github.event.repository.name }}

      - uses: actions/upload-pages-artifact@v4
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        with:
          path: app/web/build

  deploy:
    needs: verify
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
