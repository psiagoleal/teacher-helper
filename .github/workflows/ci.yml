# Caminho relativo: .github/workflows/ci.yml
#
# Verifica Rust, WASM e web em todo PR e na main; procura segredos; publica no GitHub Pages a
# partir da main. Actions fixadas por SHA (atualizadas pelo Dependabot).

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  segredos:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2
        with:
          tool: wasm-pack

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: pnpm

      - name: Rust — formatação
        run: cargo fmt --all --check

      - name: Rust — lint
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Rust — testes
        run: cargo test --workspace

      - name: WASM — testes
        run: wasm-pack test --node app/wasm

      - name: WASM — build
        run: wasm-pack build app/wasm --target web --release

      - name: Web — dependências
        run: pnpm install --frozen-lockfile

      - name: Web — tipos
        run: pnpm -C app/web check

      - name: Web — lint
        run: pnpm -C app/web lint

      - name: Web — testes
        run: pnpm -C app/web test

      - name: Web — navegador para e2e
        run: pnpm -C app/web exec playwright install --with-deps chromium

      - name: Web — e2e
        run: pnpm -C app/web test:e2e

      - name: Web — build para o GitHub Pages
        run: pnpm -C app/web build
        env:
          BASE_PATH: /${{ github.event.repository.name }}

      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        with:
          path: app/web/build

  deploy:
    needs: [segredos, verify]
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
