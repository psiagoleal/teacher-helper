# Caminho relativo: .github/dependabot.yml
#
# Atualizações semanais: Rust, pacotes JS (pnpm) e actions do CI (fixadas por SHA).
# Só minor e patch vêm agrupadas; cada major chega em PR própria, para quebrar uma de cada vez.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      rust:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      # Vitest e seus pacotes só funcionam na mesma versão: sobem juntos, inclusive major.
      vitest:
        patterns: ["vitest", "@vitest/*", "vitest-browser-*"]
      js:
        update-types: [minor, patch]
    ignore:
      # TypeScript 7 (compilador nativo) não tem a API JS que svelte-check e SvelteKit usam.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      # Os tipos acompanham a versão do Node usada no projeto (24).
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci(deps)"
    groups:
      actions:
        patterns: ["*"]
