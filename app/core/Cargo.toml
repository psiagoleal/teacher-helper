# Caminho relativo: app/core/Cargo.toml

[package]
name = "teacher-helper-core"
version = "0.0.0"
description = "Núcleo do teacher-helper: modelo de documento, skills, validação e exportação."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

# Regra do ADR-0003/0004: sem dependências de navegador (web-sys, js-sys, wasm-bindgen).
[dependencies]
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_path_to_error = "0.1.20"

[lints]
workspace = true
